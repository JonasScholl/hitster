[tool.poetry]
name = "hitster"
version = "1.0.0"
description = ""
authors = ["Jonas Scholl <jonas@scholl.tech>"]
readme = "README.md"
packages = [{include = "generator"}]

[tool.poetry.dependencies]
python = "^3.12"
typst = ">=0.15.0,<0.16.0"
spotipy = "^2.26.0"
qrcode = "^8.2"
matplotlib = "^3.11.1"
pyjwt = "^2.13.0"
cryptography = ">=50.0.0,<51.0.0"
requests = "^2.34.2"
python-dotenv = "^1.2.3"
pydantic = "^2.13.4"
rich = ">=15.0.0,<16.0.0"
cairosvg = "^2.9.0"
term-image = "^0.7.2"

[tool.poetry.scripts]
generate-hitster-cards = "generator.main:main"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.4,<0.17.0"
pre-commit = "^4.6.2"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long, handled by formatter
    "PLR0915", # too many statements in function
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR2004", # magic value used in comparison
    "RUF001", # ambiguous string character
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["generator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
